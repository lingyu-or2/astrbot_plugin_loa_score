name: astrbot_plugin_loa_score
display_name: 命运方舟首饰评分
short_desc: 发送装备/手镯截图，按 lopec 口径识别词条并给出 下/中/上 评级与战力倍率。（需多模态模型或识别专用提供商）
desc: 识别《命运方舟》装备（项链/耳环/戒指/手镯）属性截图，离线按 lopec.kr 评分规则（T4 遗物/古代 下/中/上 档位、主属性百分比、战力倍率）计算并回复评分。词条识别由多模态模型（会话模型或识别专用提供商）完成，评分规则表离线内置，无需联网查表。
version: 1.2.0
author: moLing
repo: https://github.com/lingyu-or2/astrbot_plugin_loa_score
astrbot_version: ">=4.5.0"
